    function show(selector,start,duration=.3,y=0){tl.fromTo(selector,{opacity:0,y},{opacity:1,y:0,duration,ease:'power3.out'},start)}
    function type(selector,start,duration){
      const element=document.querySelector(selector);
      const walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT);
      const nodes=[];let node;while(node=walker.nextNode())nodes.push({node,text:node.textContent});
      const length=nodes.reduce((n,item)=>n+item.text.length,0);
      const state={characters:0};
      const draw=()=>{let remaining=Math.floor(state.characters);for(const item of nodes){item.node.textContent=item.text.slice(0,Math.max(0,remaining));remaining-=item.text.length}};
      draw();
      tl.fromTo(state,{characters:0},{characters:length,duration,ease:'none',immediateRender:false,onUpdate:draw},start);
    }
